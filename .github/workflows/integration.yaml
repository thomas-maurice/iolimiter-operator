name: Integration Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0

      - name: Create kind cluster
        run: kind create cluster --name integration --config dev/kind-config.yaml --wait 60s

      - name: Set up loop device in kind node
        run: |
          docker exec integration-control-plane mkdir -p /scripts
          docker cp scripts/setup-loopdev.sh integration-control-plane:/scripts/setup-loopdev.sh
          docker exec integration-control-plane bash /scripts/setup-loopdev.sh

      - name: Build and load image
        run: |
          docker build -t k8s-blkio-limiter:local .
          kind load docker-image k8s-blkio-limiter:local --name integration

      - name: Pre-load busybox into kind
        run: |
          docker pull busybox:stable
          docker save busybox:stable | docker exec -i integration-control-plane ctr --namespace=k8s.io images import -

      - name: Deploy via Helm
        run: |
          helm upgrade --install k8s-blkio-limiter charts/k8s-blkio-limiter \
            -n kube-system --create-namespace \
            -f dev/values-kind.yaml
          kubectl -n kube-system rollout status daemonset/k8s-blkio-limiter --timeout=60s

      - name: Deploy test pod
        run: |
          kubectl apply -f dev/test-pod.yaml
          kubectl wait --for=condition=Ready pod/io-limit-test --timeout=60s

      - name: Verify limits applied
        run: |
          echo "Waiting for limits to be applied..."
          for i in $(seq 1 12); do
            IOMAX=$(kubectl exec io-limit-test -- cat /sys/fs/cgroup/io.max 2>/dev/null || true)
            if echo "$IOMAX" | grep -q "riops=100"; then
              echo "PASS: io.max has expected limits"
              echo "io.max: $IOMAX"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "FAIL: io.max never got expected limits after 60s"
              echo "io.max: $IOMAX"
              kubectl -n kube-system logs -l app.kubernetes.io/name=k8s-blkio-limiter --tail=30
              exit 1
            fi
            sleep 5
          done

      - name: Verify limits reset on annotation removal
        run: |
          kubectl annotate pod io-limit-test blkio-limiter.maurice.fr/data-
          echo "Waiting for limits to be reset..."
          for i in $(seq 1 12); do
            IOMAX=$(kubectl exec io-limit-test -- cat /sys/fs/cgroup/io.max 2>/dev/null || true)
            if [ -z "$IOMAX" ] || echo "$IOMAX" | grep -q "riops=max"; then
              echo "PASS: io.max reset after annotation removal"
              echo "io.max: ${IOMAX:-(empty)}"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "FAIL: io.max not reset after 60s"
              echo "io.max: $IOMAX"
              kubectl -n kube-system logs -l app.kubernetes.io/name=k8s-blkio-limiter --tail=30
              exit 1
            fi
            sleep 5
          done

      - name: Verify limits re-applied
        run: |
          kubectl annotate pod io-limit-test blkio-limiter.maurice.fr/data="path=/data riops=200 wiops=100"
          echo "Waiting for new limits..."
          for i in $(seq 1 12); do
            IOMAX=$(kubectl exec io-limit-test -- cat /sys/fs/cgroup/io.max 2>/dev/null || true)
            if echo "$IOMAX" | grep -q "riops=200"; then
              echo "PASS: new limits applied"
              echo "io.max: $IOMAX"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "FAIL: new limits not applied after 60s"
              echo "io.max: $IOMAX"
              kubectl -n kube-system logs -l app.kubernetes.io/name=k8s-blkio-limiter --tail=30
              exit 1
            fi
            sleep 5
          done

      - name: Show DaemonSet logs
        if: always()
        run: kubectl -n kube-system logs -l app.kubernetes.io/name=k8s-blkio-limiter --tail=50

      - name: Cleanup
        if: always()
        run: kind delete cluster --name integration
