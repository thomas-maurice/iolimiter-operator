# Binds the agent's ServiceAccount to the same metrics-auth-role the
# controller uses (config/rbac/metrics_auth_role.yaml): tokenreviews /
# subjectaccessreviews create, needed for the secure (authn/authz-gated)
# metrics endpoint (SPEC.md §8, §7).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-auth-role
subjects:
- kind: ServiceAccount
  name: agent
  namespace: system
