---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-role
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.maurice.fr
  resources:
  - podiolimits
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.maurice.fr
  resources:
  - podiolimits/status
  verbs:
  - get
  - patch
  - update
