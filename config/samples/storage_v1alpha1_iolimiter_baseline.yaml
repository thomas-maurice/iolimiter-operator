# One of two overlapping IOLimiters (see also
# storage_v1alpha1_iolimiter_strict.yaml) demonstrating SPEC.md D2:
# per-field minimum, most restrictive wins. This one is a namespace-wide
# baseline (podSelector: {} matches every pod in the namespace) capping the
# "scratch" volume at 50Mi/s.
apiVersion: storage.maurice.fr/v1alpha1
kind: IOLimiter
metadata:
  labels:
    app.kubernetes.io/name: iolimiter-operator
    app.kubernetes.io/managed-by: kustomize
  name: namespace-baseline
spec:
  podSelector: {}
  volumes:
    - name: scratch
      limits:
        readBytesPerSecond: 50Mi
        writeBytesPerSecond: 50Mi
