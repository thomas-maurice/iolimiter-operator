apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: podiolimit-status-write-restricted-binding
  labels:
    app.kubernetes.io/name: iolimiter-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  # kustomize's nameReference config (kustomizeconfig.yaml in this dir)
  # rewrites this to the namePrefixed policy name; written un-prefixed here.
  policyName: podiolimit-status-write-restricted
  validationActions: ["Deny"]
  matchResources: {}
