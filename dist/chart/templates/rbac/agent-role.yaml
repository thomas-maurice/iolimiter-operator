{{- if or (not (hasKey .Values.agent "enabled")) (.Values.agent.enabled) }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "k8s-blkio-limiter.resourceName" (dict "suffix" "agent-role" "context" $) }}
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.maurice.fr
  resources:
  - podiolimits
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.maurice.fr
  resources:
  - podiolimits/status
  verbs:
  - get
  - patch
  - update
{{- end }}
